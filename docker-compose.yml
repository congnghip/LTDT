version: '3.8'

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ltdd_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ltdd_tuan7
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend ASP.NET Core Web API
  backend:
    build:
      context: ./Sang6_WebAPI
      dockerfile: Dockerfile
    container_name: ltdd_backend
    restart: always
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=ltdd_tuan7;Username=postgres;Password=admin
      - JWTKey__Secret=AReallyLongSecretKeyForYourJWTTokenSigning1234567890!
      - JWTKey__ValidIssuer=Sang6_WebAPI
      - JWTKey__ValidAudience=Sang6_WebAPI_Client
      - JWTKey__TokenExpiryTimeInHour=24
    ports:
      - "5000:5000"

  # 3. Frontend Flutter Web (Nginx)
  frontend:
    build:
      context: ./fb_interface
      dockerfile: Dockerfile
    container_name: ltdd_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
